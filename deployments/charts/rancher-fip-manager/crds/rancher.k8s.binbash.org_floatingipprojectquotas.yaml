apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: floatingipprojectquotas.rancher.k8s.binbash.org
spec:
  group: rancher.k8s.binbash.org
  versions:
    - name: v1beta2
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                displayName:
                  type: string
                floatingIPQuota:
                  type: object
                  additionalProperties:
                    type: integer
            status:
              type: object
              properties:
                fips:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      family:
                        type: string
                      allocated:
                        type: object
                        additionalProperties:
                          type: string
                      used:
                        type: integer
                conditions:
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                        type: string
                      type:
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
      subresources:
        status: {}
    - name: v1beta1
      served: true
      storage: false
      deprecated: true
      deprecationWarning: "rancher.k8s.binbash.org/v1beta1 FloatingIPProjectQuota is deprecated"
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                displayName:
                  type: string
                floatingIPQuota:
                  type: object
                  additionalProperties:
                    type: integer
            status:
              type: object
              properties:
                fips:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      family:
                        type: string
                      allocated:
                        type: object
                        additionalProperties:
                          type: string
                      used:
                        type: integer
      subresources:
        status: {}
  scope: Cluster
  names:
    plural: floatingipprojectquotas
    singular: floatingipprojectquota
    kind: FloatingIPProjectQuota
    listKind: FloatingIPProjectQuotaList
