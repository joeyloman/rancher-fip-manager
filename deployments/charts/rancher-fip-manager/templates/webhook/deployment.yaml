apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rancher-fip-manager-webhook.fullname" . }}
  namespace: {{ .Release.Namespace | default "kube-system" }}
  labels:
    {{- include "rancher-fip-manager-webhook.labels" . | nindent 4 }}
spec:
  {{- if not .Values.webhook.autoscaling.enabled }}
  replicas: {{ .Values.webhook.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rancher-fip-manager-webhook.selectorLabels" . | nindent 6 }}
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 10
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      {{- with .Values.webhook.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "rancher-fip-manager-webhook.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.webhook.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webhook.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webhook.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      dnsPolicy: ClusterFirst
      {{- with .Values.webhook.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rancher-fip-manager-webhook.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.webhook.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.webhook.securityContext | nindent 12 }}
          image: "{{ .Values.webhook.image.repository }}:{{ .Values.webhook.image.tag | default .Chart.AppVersion }}"
          {{- with .Values.webhook.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ .Values.webhook.image.pullPolicy }}
          resources:
            {{- toYaml .Values.webhook.resources | nindent 12 }}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          # Port literal, not values.webhook.webhookListenPort: the binary
          # hardcodes :8443 (REPORT.md 5.5), so values-driven ports would
          # silently mis-target the probes.
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          # startupProbe covers first boot: CSR signing plus recovery
          # retries may keep /readyz red for minutes without the kubelet
          # killing the pod.
          startupProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          # /readyz is material-gated: the Service only advertises the
          # endpoint while TLS handshakes can actually succeed, so renewals
          # and recovery windows shed admission calls instead of failing
          # closed against a dead handshake (REPORT.md 5.1).
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          # tcpSocket only catches a dead process or a failed rebind; the
          # threshold outlives any rebind recovery window.
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
