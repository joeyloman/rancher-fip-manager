apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rancher-fip-manager-webhook.fullname" . }}
  labels:
    {{- include "rancher-fip-manager-webhook.labels" . | nindent 4 }}
rules:
- apiGroups:
  - certificates.k8s.io
  resources:
  - certificatesigningrequests
  verbs:
  - create
  - get
  - delete
- apiGroups:
  - certificates.k8s.io
  resources:
  - certificatesigningrequests/approval
  verbs:
  - update
- apiGroups:
  - certificates.k8s.io
  resources:
  - signers
  resourceNames:
  - kubernetes.io/kubelet-serving
  verbs:
  - approve
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingwebhookconfigurations
  verbs:
  - create
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingwebhookconfigurations
  resourceNames:
  - rancher-fip-manager-validator
  verbs:
  - get
  - delete
  - update
- apiGroups:
  - rancher.k8s.binbash.org
  resources:
  - floatingips
  - floatingippools
  - floatingipprojectquotas
  verbs:
  - get
  - list
