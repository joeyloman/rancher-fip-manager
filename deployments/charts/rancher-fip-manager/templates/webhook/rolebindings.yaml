{{- if .Values.webhook.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rancher-fip-manager-webhook.fullname" . }}
  namespace: {{ .Release.Namespace | default "kube-system" }}
  labels:
    {{- include "rancher-fip-manager-webhook.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rancher-fip-manager-webhook.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "rancher-fip-manager-webhook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | default "kube-system" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rancher-fip-manager-webhook.fullname" . }}-cabundle
  namespace: "kube-system"
  labels:
    {{- include "rancher-fip-manager-webhook.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rancher-fip-manager-webhook.fullname" . }}-cabundle
subjects:
- kind: ServiceAccount
  name: {{ include "rancher-fip-manager-webhook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | default "kube-system" }}
{{- end }}
