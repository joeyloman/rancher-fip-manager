apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rancher-fip-manager.fullname" . }}
  namespace: {{ .Release.Namespace | default "kube-system" }}
  labels:
    {{- include "rancher-fip-manager.labels" . | nindent 4 }}
spec:
  {{- if not .Values.manager.autoscaling.enabled }}
  replicas: {{ .Values.manager.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rancher-fip-manager.selectorLabels" . | nindent 6 }}
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 10
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      {{- with .Values.manager.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "rancher-fip-manager.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.manager.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      dnsPolicy: ClusterFirst
      # Must stay above the 20s gracefulDrainTimeout in cmd/manager/main.go,
      # or the SIGTERM drain path ends in SIGKILL.
      terminationGracePeriodSeconds: 30
      {{- with .Values.manager.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rancher-fip-manager.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.manager.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.manager.securityContext | nindent 12 }}
          image: "{{ .Values.manager.image.repository }}:{{ .Values.manager.image.tag | default .Chart.AppVersion }}"
          {{- with .Values.manager.env }}
          args:
            - --leader-elect=true
            - --lease-lock-name={{ include "rancher-fip-manager.fullname" . }}-lock
            - --lease-lock-namespace={{ .Release.Namespace | default "kube-system" }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ .Values.manager.image.pullPolicy }}
          resources:
            {{- toYaml .Values.manager.resources | nindent 12 }}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          # Port literal: the binary's --http-service-port defaults to 8080
          # and the args block above only renders when manager.env is set,
          # so this is the only port the server can have.
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: healthz
              containerPort: 8081
              protocol: TCP
          # /healthz is served by a dependency-free listener bound before
          # leader election (cmd/manager/main.go): the standby candidate
          # goes Ready, the ReplicaSet terminates the old leader, and the
          # lease hands over. Probing the 8080 HTTP service instead would
          # deadlock the rollout, because that server only starts once
          # leadership is acquired. Generous thresholds still catch a dead
          # process without killing pods for slow cache syncs.
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
