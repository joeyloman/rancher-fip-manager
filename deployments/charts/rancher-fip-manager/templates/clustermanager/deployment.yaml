apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rancher-fip-cluster-manager.fullname" . }}
  namespace: {{ .Release.Namespace | default "kube-system" }}
  labels:
    {{- include "rancher-fip-cluster-manager.labels" . | nindent 4 }}
spec:
  {{- if not .Values.clustermanager.autoscaling.enabled }}
  replicas: {{ .Values.clustermanager.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rancher-fip-cluster-manager.selectorLabels" . | nindent 6 }}
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 10
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      {{- with .Values.clustermanager.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "rancher-fip-cluster-manager.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.clustermanager.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clustermanager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clustermanager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      dnsPolicy: ClusterFirst
      # Must stay above the 20s gracefulDrainTimeout in
      # clustermanager/cmd/cluster-manager/main.go, or the SIGTERM drain
      # path ends in SIGKILL.
      terminationGracePeriodSeconds: 30
      {{- with .Values.clustermanager.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rancher-fip-cluster-manager.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.clustermanager.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.clustermanager.securityContext | nindent 12 }}
          image: "{{ .Values.clustermanager.image.repository }}:{{ .Values.clustermanager.image.tag | default .Chart.AppVersion }}"
          args:
            - --leader-elect=true
            - --lease-lock-name={{ include "rancher-fip-cluster-manager.fullname" . }}-lock
            - --lease-lock-namespace={{ .Release.Namespace | default "kube-system" }}
            - --app-namespace={{ .Release.Namespace | default "kube-system" }}
            - --health-probe-bind-address=:8081
          {{- with .Values.clustermanager.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ .Values.clustermanager.image.pullPolicy }}
          resources:
            {{- toYaml .Values.clustermanager.resources | nindent 12 }}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          ports:
            - name: healthz
              containerPort: 8081
              protocol: TCP
          # /healthz and /readyz are served by a dependency-free listener
          # bound before leader election (cmd/cluster-manager/main.go,
          # serveHealthProbe): controller-runtime binds its own probe server
          # only inside mgr.Start, which is gated on OnStartedLeading here -
          # probing that instead deadlocked rollouts, and a wedged manager
          # process was invisible to Kubernetes.
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
