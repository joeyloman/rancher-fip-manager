apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rancher-fip-api-server.fullname" . }}
  labels:
    {{- include "rancher-fip-api-server.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - management.cattle.io
  resources:
  - projects
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - rancher.k8s.binbash.org
  resources:
  - floatingips
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - delete
- apiGroups:
  - rancher.k8s.binbash.org
  resources:
  - floatingippools
  verbs:
  - get
  - list
  - watch
