apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rancher-fip-api-server.fullname" . }}
  namespace: {{ .Release.Namespace | default "kube-system" }}
  labels:
    {{- include "rancher-fip-api-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.apiserver.autoscaling.enabled }}
  replicas: {{ .Values.apiserver.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rancher-fip-api-server.selectorLabels" . | nindent 6 }}
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 10
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      {{- with .Values.apiserver.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "rancher-fip-api-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.apiserver.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiserver.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiserver.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      dnsPolicy: ClusterFirst
      # Must stay above shutdownGracePeriod in apiserver/cmd/api-server/main.go
      # (45s: the 30s allocation wait plus 10s cleanup plus 5s margin), or the
      # kubelet SIGKILLs an in-flight allocation request mid-write.
      terminationGracePeriodSeconds: 50
      {{- with .Values.apiserver.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rancher-fip-api-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.apiserver.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.apiserver.securityContext | nindent 12 }}
          image: "{{ .Values.apiserver.image.repository }}:{{ .Values.apiserver.image.tag | default .Chart.AppVersion }}"
          args:
            - --jwt-generate-key=true
            - --jwt-secret-name=jwt-private-key
            - --jwt-secret-namespace={{ .Release.Namespace | default "kube-system" }}
            - --listen-address=:{{ .Values.apiserver.service.apiPort | default 8080 }}
            - --health-probe-bind-address=:8081
{{- if .Values.apiserver.service.tls.enabled }}
            - --tls-enabled=true
            - --tls-cert-file=/etc/tls/tls.crt
            - --tls-key-file=/etc/tls/tls.key
{{- end }}
          {{- with .Values.apiserver.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
          - name: api
            containerPort: {{ .Values.apiserver.service.apiPort | default 8080 }}
            protocol: TCP
          - name: healthz
            containerPort: 8081
            protocol: TCP
          imagePullPolicy: {{ .Values.apiserver.image.pullPolicy }}
          resources:
            {{- toYaml .Values.apiserver.resources | nindent 12 }}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          # /healthz and /readyz are served by a dependency-free plain-HTTP
          # listener (cmd/api-server/main.go, serveHealthProbe). The old
          # tcpSocket probes dialed the TLS listener on the api port, which
          # logged a "TLS handshake error" line per probe tick.
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
{{- if .Values.apiserver.service.tls.enabled }}
          volumeMounts:
            - name: tls-secret-volume
              mountPath: /etc/tls
              readOnly: true
      volumes:
        - name: tls-secret-volume
          secret:
            secretName: {{ include "rancher-fip-api-server.fullname" . }}-tls
{{- end }}
