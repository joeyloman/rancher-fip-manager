apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rancher-fip-lb-controller.fullname" . }}
  labels:
    {{- include "rancher-fip-lb-controller.labels" . | nindent 4 }}
rules:
# Secrets and ConfigMaps are read only in --app-namespace ({{ .Release.Namespace }});
# that access is granted by the namespaced Role, not here.
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
  - update
  - delete
  - patch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - get
  - list
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - metallb.io
  resources:
  - ipaddresspools
  - l2advertisements
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - purelb.io
  resources:
  - servicegroups
  - lbnodeagents
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
