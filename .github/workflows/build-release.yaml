name: Tag and push release to GHCR

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  WEBHOOK_IMAGE_NAME: ${{ github.repository_owner }}/rancher-fip-manager-webhook
  APISERVER_IMAGE_NAME: ${{ github.repository_owner }}/rancher-fip-api-server
  CLUSTERMANAGER_IMAGE_NAME: ${{ github.repository_owner }}/rancher-fip-cluster-manager

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag a container build to the release version and push image to GHCR
        id: build-image
        run: |
          docker pull $REGISTRY/$IMAGE_NAME:$(echo ${GITHUB_SHA:0:8})
          docker tag $REGISTRY/$IMAGE_NAME:$(echo ${GITHUB_SHA:0:8}) $REGISTRY/$IMAGE_NAME:$GITHUB_REF_NAME
          docker push $REGISTRY/$IMAGE_NAME:$GITHUB_REF_NAME

  build-webhook-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag a webhook container build to the release version and push image to GHCR
        id: build-webhook-image
        run: |
          docker pull $REGISTRY/$WEBHOOK_IMAGE_NAME:$(echo ${GITHUB_SHA:0:8})
          docker tag $REGISTRY/$WEBHOOK_IMAGE_NAME:$(echo ${GITHUB_SHA:0:8}) $REGISTRY/$WEBHOOK_IMAGE_NAME:$GITHUB_REF_NAME
          docker push $REGISTRY/$WEBHOOK_IMAGE_NAME:$GITHUB_REF_NAME

  build-apiserver-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag an api-server container build to the release version and push image to GHCR
        id: build-apiserver-image
        run: |
          docker pull $REGISTRY/$APISERVER_IMAGE_NAME:$(echo ${GITHUB_SHA:0:8})
          docker tag $REGISTRY/$APISERVER_IMAGE_NAME:$(echo ${GITHUB_SHA:0:8}) $REGISTRY/$APISERVER_IMAGE_NAME:$GITHUB_REF_NAME
          docker push $REGISTRY/$APISERVER_IMAGE_NAME:$GITHUB_REF_NAME

  build-clustermanager-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag a cluster-manager container build to the release version and push image to GHCR
        id: build-clustermanager-image
        run: |
          docker pull $REGISTRY/$CLUSTERMANAGER_IMAGE_NAME:$(echo ${GITHUB_SHA:0:8})
          docker tag $REGISTRY/$CLUSTERMANAGER_IMAGE_NAME:$(echo ${GITHUB_SHA:0:8}) $REGISTRY/$CLUSTERMANAGER_IMAGE_NAME:$GITHUB_REF_NAME
          docker push $REGISTRY/$CLUSTERMANAGER_IMAGE_NAME:$GITHUB_REF_NAME
